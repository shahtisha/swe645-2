<!--
error.html
This file is a simple error page displayed when the main website content is unavailable
during static website hosting.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Unavailable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        body {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="w3-display-middle w3-center w3-padding">
        <h1 class="w3-xxlarge w3-text-red">404</h1>
        <p class="w3-large">This page is currently unavailable.</p>
        <p class="w3-small">
            Please return to the homepage or try again later.
        </p>
    </div>
</body>
</html>
